# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

# Tauri packages exist on both the JS (npm) and Rust (cargo) side and must stay
# in sync (e.g. @tauri-apps/plugin-dialog <-> tauri-plugin-dialog). A
# multi-ecosystem group puts them into one single PR.
multi-ecosystem-groups:
  tauri:
    schedule:
      interval: 'weekly'

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    multi-ecosystem-group: 'tauri'
    patterns:
      - '@tauri-apps/*'
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - 'ng-packagr'
      angular-security:
        applies-to: security-updates
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - 'ng-packagr'
  - package-ecosystem: 'cargo' # See documentation for possible values
    directory: '/src-tauri' # Location of package manifests
    schedule:
      interval: 'weekly'
    multi-ecosystem-group: 'tauri'
    patterns:
      - 'tauri'
      - 'tauri-*'
  - package-ecosystem: 'github-actions'
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: '/'
    schedule:
      interval: 'weekly'
