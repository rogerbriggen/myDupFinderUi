name: Build, test, and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decide which parts of the repo a pull request touches so we can skip
  # expensive jobs (mainly Rust compilation) that cannot be affected.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/build.yml'
            frontend:
              - '**'
              - '!src-tauri/**'

  frontend:
    name: Frontend (Angular)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier format check
        run: pnpm format:check

      - name: Angular lint
        run: pnpm lint

      - name: Angular build
        run: pnpm build

      - name: Angular tests
        run: pnpm test

  rust-linux:
    name: Rust (Linux)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Debug info is not needed for fmt/clippy/test runs; skipping it makes
      # compiling and linking the (large) Tauri dependency tree noticeably faster.
      CARGO_PROFILE_DEV_DEBUG: 0

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Only main writes the cache; PRs restore it read-only (saves the
          # post-job upload time and avoids evicting main's cache).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri::generate_context! only needs frontendDist to exist, not the real
      # Angular build, so stub it instead of waiting for / installing the frontend.
      - name: Stub frontend dist
        run: |
          mkdir -p dist/mydupfinderui/browser
          echo '<!doctype html>' > dist/mydupfinderui/browser/index.html

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-features

  # Stable aggregate check (keeps the old required-check name). Skipped
  # sub-jobs count as success; only real failures/cancellations fail it.
  test-linux:
    name: Test (Linux)
    needs: [frontend, rust-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        run: |
          echo "frontend: ${{ needs.frontend.result }}"
          echo "rust-linux: ${{ needs.rust-linux.result }}"
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"

  test-windows:
    name: Test (Windows)
    # Skip on pull requests; still runs on push to main, tag pushes, and workflow_dispatch.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier format check
        run: pnpm format:check

      - name: Angular lint
        run: pnpm lint

      - name: Angular build
        run: pnpm build

      - name: Angular tests
        run: pnpm test

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-features

  test-macos:
    name: Test (macOS)
    # Only run on tagged releases.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier format check
        run: pnpm format:check

      - name: Angular lint
        run: pnpm lint

      - name: Angular build
        run: pnpm build

      - name: Angular tests
        run: pnpm test

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-features

  package-linux:
    name: Package (Linux)
    needs: [changes, test-linux]
    # Full release build is the slowest job; on PRs only run it when Rust/Tauri files changed.
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ubuntu-latest-release

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Stage bundles
        shell: bash
        run: |
          mkdir -p staging
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/{deb,appimage,rpm}/*; do
            cp -R "$f" staging/
          done
          ls -la staging

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mydupfinderui-linux-x64
          path: staging/*
          if-no-files-found: error

  package-windows:
    name: Package (Windows)
    needs: test-windows
    # Skip on pull requests; still runs on push to main, tag pushes, and workflow_dispatch.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-latest-release

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Stage bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Get-ChildItem -Path src-tauri/target/release/bundle/msi,src-tauri/target/release/bundle/nsis -File -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName staging/ }
          Get-ChildItem staging

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mydupfinderui-windows-x64
          path: staging/*
          if-no-files-found: error

  package-macos:
    name: Package (macOS)
    needs: test-macos
    # Only build for tagged releases.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-latest-release

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Stage bundles
        shell: bash
        run: |
          mkdir -p staging
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/{dmg,macos}/*; do
            cp -R "$f" staging/
          done
          ls -la staging

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mydupfinderui-macos
          path: staging/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [package-linux, package-windows, package-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Zip each platform bundle
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -r "../../release/${name}.zip" .)
          done
          ls -la ../release

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
